<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AST Viewer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    svg { font-family: Arial, sans-serif; }
    .node circle { fill: #fff; stroke: steelblue; stroke-width: 1.5px; }
    .node text { font-size: 12px; }
    .link { fill: none; stroke: #555; stroke-width: 1.5px; }
  </style>
</head>
<body>
  <h2>AST Viewer</h2>
  <svg width="1200" height="800"></svg>
  <script>
    fetch('ast.json').then(r => r.json()).then(data => {
      if (!data) { document.body.append("No AST (ast.json is null)"); return; }
      const root = d3.hierarchy(data, d => d.children && d.children.length ? d.children : null);

      const svg = d3.select("svg");
      const width = +svg.attr("width");
      const height = +svg.attr("height");
      const g = svg.append("g").attr("transform", "translate(40,40)");

      const tree = d3.tree().size([height - 80, width - 160]);
      tree(root);

      g.selectAll(".link")
        .data(root.links())
        .enter().append("path")
        .attr("class","link")
        .attr("d", d3.linkHorizontal()
            .x(d => d.y)
            .y(d => d.x));

      const node = g.selectAll(".node")
        .data(root.descendants())
        .enter().append("g")
        .attr("class","node")
        .attr("transform", d => `translate(${d.y},${d.x})`);

      node.append("circle").attr("r",6);
      node.append("text")
        .attr("dy", 3)
        .attr("x", d => d.children ? -10 : 10)
        .style("text-anchor", d => d.children ? "end" : "start")
        .text(d => d.data.name + (d.data.val ? (":" + d.data.val) : ""));
    }).catch(e => {
      document.body.append("Failed to load ast.json — make sure it exists and you serve this directory with http server. Error: " + e);
    });
  </script>
</body>
</html>
